<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شایان، صالحه؟ | یکی در میان</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1f;--muted:#6b6b70;--a:#2f6fed;--b:#1f9d55;--bad:#d93a3a;--line:#e3e1da;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#15161a;--card:#1f2127;--text:#f0f0f2;--muted:#9a9aa3;--a:#6c9cff;--b:#4cd38a;--bad:#ff6b6b;--line:#2e3038;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7;display:flex;justify-content:center;padding:16px;user-select:none}
.wrap{max-width:520px;width:100%;text-align:center}
h1{font-size:1.6rem;font-weight:900;margin:4px 0}
.muted{color:var(--muted);font-size:.85rem}
img{max-width:70%;border-radius:12px;margin:4px 0}
.score{font-size:2.6rem;font-weight:900;line-height:1.2}
.stats{display:flex;justify-content:space-around;margin:6px 0 14px}
.stats b{display:block;font-size:1.2rem}
#bubble{min-height:56px;font-weight:700;font-size:1.05rem;margin-bottom:10px}
.row{display:flex;gap:12px}
.p{flex:1;font:inherit;font-weight:900;font-size:1.15rem;border:3px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);padding:36px 8px;cursor:pointer;transition:transform .08s,border-color .15s,box-shadow .15s}
.p small{display:block;font-weight:400;color:var(--muted);margin-top:4px}
.p:active{transform:scale(.96)}
#pa.next{border-color:var(--a);box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 25%,transparent);animation:pulse .8s infinite}
#pb.next{border-color:var(--b);box-shadow:0 0 0 4px color-mix(in srgb,var(--b) 25%,transparent);animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.reset{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;margin-top:14px}
</style>
</head>

  <h1>شایان، صالحه؟</h1>
  <p class="muted">اسکرین‌شات بگیر و رکوردت رو برای بقیه بفرست 📸</p>

  <div class="score" id="score">۰</div>
  <div class="stats">
    <div><b id="streak">۰</b><span class="muted">رکورد فعلی</span></div>
    <div><b id="mult">×۱</b><span class="muted">ضریب</span></div>
    <div><b id="best">۰</b><span class="muted">بهترین رکورد</span></div>
  </div>

  <div id="bubble">اول یکی از دو تا رو بزن 👇</div>

  <div class="row">
    <button class="p" id="pa">شایان صالحه<small>اینی که منم 😄</small></button>
    <button class="p" id="pb">صالح نظری<small>نه شایان!</small></button>
  </div>
  <button class="reset" id="reset">شروع دوباره</button>
</div>

<script>
const $=id=>document.getElementById(id);
const KEY="shayanAltV1";
let S={score:0,streak:0,best:0,last:null};
try{const x=JSON.parse(localStorage.getItem(KEY));if(x)S=Object.assign(S,x)}catch(e){}

const UN=[[1e15,"کوادریلیون"],[1e12,"تریلیون"],[1e9,"میلیارد"],[1e6,"میلیون"]];
function fmt(v){v=Math.floor(v);for(const [u,n] of UN)if(v>=u)return (Math.floor(v/u*100)/100).toLocaleString("fa")+" "+n;return v.toLocaleString("fa")}
const mult=()=>1+Math.floor(S.streak/10);

const SAY={
 a:["شایان، صالحه؟","«آره بابا، خودمم!»","«شایان صالحه‌م، نه صالح نظری 🙋‍♂️»"],
 b:["«نه بابا، من صالح نظریم! شایان صالحه اونه.»","«شایان اونورِ 😄»","«من صالحم؛ شایان صالحه یکی دیگه‌ست!»"]
};
const MILE={25:"۲۵ تا پشت هم! دیگه کسی اشتباه نمی‌گیره.",50:"۵۰! شایان و صالح رسماً جدا شدن 🎉",100:"۱۰۰! تو استاد تشخیص شایان و صالحی 🏆",250:"۲۵۰! این بازی هیچ‌وقت تموم نمی‌شه…"};

function render(){
  $("score").textContent=fmt(S.score);
  $("streak").textContent=fmt(S.streak);
  $("mult").textContent="×"+mult().toLocaleString("fa");
  $("best").textContent=fmt(S.best);
  $("pa").classList.toggle("next",S.last==="b");
  $("pb").classList.toggle("next",S.last==="a");
  document.title=fmt(S.score)+" | شایان، صالحه؟";
}
function say(t,bad){const b=$("bubble");b.textContent=t;b.style.color=bad?"var(--bad)":"var(--text)"}
function tap(who){
  const el=$(who==="a"?"pa":"pb");
  if(S.last===who){ // same twice: streak breaks, game goes on
    S.streak=0;
    el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");
    say(who==="a"?"شایان، صالحه؟ آره! ولی الان نوبت صالح نظریه 😅":"نه بابا! الان نوبت شایان صالحه‌ست 😅",true);
  }else{
    S.last=who;S.streak++;
    S.score+=mult();
    if(S.streak>S.best)S.best=S.streak;
    const arr=SAY[who];say(arr[Math.floor(Math.random()*arr.length)]);
    if(MILE[S.streak])say(MILE[S.streak]);
  }
  render();save();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
$("pa").onclick=()=>tap("a");
$("pb").onclick=()=>tap("b");
addEventListener("keydown",e=>{if(e.key==="ArrowRight")tap("a");else if(e.key==="ArrowLeft")tap("b")});
$("reset").onclick=()=>{if(confirm("مطمئنی می‌خوای از اول شروع کنی؟")){S={score:0,streak:0,best:0,last:null};say("اول یکی از دو تا رو بزن 👇");render();save()}};
render();
</script>
