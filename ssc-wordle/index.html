<title>SSC Wordle</title>
<style>
:root{--bg:#fff;--text:#1a1a1b;--muted:#787c7e;--line:#d3d6da;--fill:#878a8c;--g:#6aaa64;--y:#c9b458;--x:#787c7e;--key:#d3d6da;--toastbg:#121213;--toasttext:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121213;--text:#fff;--muted:#818384;--line:#3a3a3c;--fill:#565758;--g:#538d4e;--y:#b59f3b;--x:#3a3a3c;--key:#818384;--toastbg:#fff;--toasttext:#121213;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,'Segoe UI',Tahoma,sans-serif;line-height:1.6;display:flex;justify-content:center;user-select:none;touch-action:manipulation}
.wrap{max-width:500px;width:100%;display:flex;flex-direction:column;align-items:center;min-height:100vh;min-height:100dvh;padding-bottom:max(8px,env(safe-area-inset-bottom))}
header{width:100%;text-align:center;border-bottom:1px solid var(--line);padding:8px 0}
header h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;font-weight:700;letter-spacing:.02em}
.sub{color:var(--muted);font-size:.85rem;margin:6px 0 0}
#toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--toastbg);color:var(--toasttext);font-weight:700;font-size:.95rem;padding:12px 16px;border-radius:6px;animation:fadeout .25s ease 1.5s forwards;white-space:nowrap}
.toast.stay{animation:none}
@keyframes fadeout{to{opacity:0}}
#boardwrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;overflow:hidden;min-height:0}
#board{direction:ltr;display:flex;flex-direction:column;gap:5px;padding:10px;max-height:100%;overflow-y:auto}
.row{display:flex;gap:5px}
.t{width:clamp(40px,12.5vw,58px);height:clamp(40px,12.5vw,58px);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:"Helvetica Neue",Arial,sans-serif;font-size:2rem;font-weight:700;text-transform:uppercase;color:var(--text);background:transparent}
.t.f{border-color:var(--fill)}
.t.pop{animation:popin .1s}
@keyframes popin{from{transform:scale(.8);opacity:0}40%{transform:scale(1.1);opacity:1}}
.t.rev{animation:flip .5s ease-in-out both}
@keyframes flip{
 0%{transform:rotateX(0);background:transparent;border-color:var(--fill);color:var(--text)}
 49%{transform:rotateX(-90deg);background:transparent;border-color:var(--fill);color:var(--text)}
 50%{transform:rotateX(-90deg);background:var(--c);border-color:var(--c);color:#fff}
 100%{transform:rotateX(0);background:var(--c);border-color:var(--c);color:#fff}}
.t.win{background:var(--c);border-color:var(--c);color:#fff;animation:bounce 1s ease both}
@keyframes bounce{0%,20%{transform:translateY(0)}40%{transform:translateY(-30px)}50%{transform:translateY(5px)}60%{transform:translateY(-15px)}80%{transform:translateY(2px)}100%{transform:translateY(0)}}
.row.shake{animation:shake .6s}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
#kb{direction:ltr;width:100%;padding:0 6px;display:flex;flex-direction:column;gap:8px}
.kr{display:flex;gap:6px;justify-content:center;touch-action:manipulation}
.k{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:.85rem;flex:1;max-width:43px;height:58px;border:0;border-radius:4px;background:var(--key);color:var(--text);cursor:pointer;padding:0;text-transform:uppercase;transition:background-color .1s}
.k.w{flex:1.5;max-width:65px;font-size:.7rem}
.k.g{background:var(--g);color:#fff}.k.y{background:var(--y);color:#fff}.k.x{background:var(--x);color:#fff}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
#modal.hide{display:none}
.box{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:360px;width:100%;text-align:center;animation:rise .25s}
@keyframes rise{from{transform:translateY(20px);opacity:0}}
.big{font-size:1.3rem;font-weight:900;margin:4px 0}
.muted{color:var(--muted);font-size:.85rem}
pre{font:inherit;white-space:pre-wrap;background:transparent;border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0;text-align:center;user-select:text}
.go{font:inherit;font-weight:700;background:var(--g);color:#fff;border:0;border-radius:24px;padding:10px 26px;cursor:pointer;margin:4px}
.go.alt{background:var(--key);color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>SSC Wordle</h1><p class="sub">Guess the 6-letter word.</p></header>
  <div id="toasts"></div>
  <div id="boardwrap"><div id="board"></div></div>
  <div id="kb"></div>
</div>

<div id="modal" class="hide">
  <div class="box">
    <div class="big">🎉 Correct: SHAYAN</div>
    <div class="muted" id="tries"></div>
    <pre id="share"></pre>
    <button class="go" id="sh">Share</button>
    <button class="go alt" id="again">Play again</button>
  </div>
</div>

<script>
const ANSWER="SHAYAN",L=6,START=6,FLIP=300;
const $=id=>document.getElementById(id);
let guesses=[],results=[],cur="",busy=false,won=false,keys={};
const board=$("board");

function ensureRows(n){
  while(board.children.length<n){
    const r=document.createElement("div");r.className="row";
    r.addEventListener("animationend",()=>r.classList.remove("shake"));
    for(let i=0;i<L;i++){const t=document.createElement("div");t.className="t";r.appendChild(t)}
    board.appendChild(r);
  }
}
function toast(t,stay){
  const el=document.createElement("div");el.className="toast"+(stay?" stay":"");el.textContent=t;
  $("toasts").prepend(el);
  if(!stay)setTimeout(()=>el.remove(),1800);
  return el;
}
function evaluate(g){
  const res=Array(L).fill("x"),left={};
  for(let i=0;i<L;i++){if(g[i]===ANSWER[i])res[i]="g";else left[ANSWER[i]]=(left[ANSWER[i]]||0)+1}
  for(let i=0;i<L;i++){if(res[i]==="g")continue;if(left[g[i]]>0){res[i]="y";left[g[i]]--}}
  return res;
}
function press(k){
  if(busy||won)return;
  const row=board.children[guesses.length];
  if(k==="ENTER")return submit();
  if(k==="DEL"){
    if(!cur.length)return;
    const t=row.children[cur.length-1];t.textContent="";t.classList.remove("f","pop");
    cur=cur.slice(0,-1);return;
  }
  if(/^[A-Z]$/.test(k)&&cur.length<L){
    const t=row.children[cur.length];t.textContent=k;t.classList.add("f");
    t.classList.remove("pop");void t.offsetWidth;t.classList.add("pop");
    cur+=k;
  }
}
function submit(){
  const row=board.children[guesses.length];
  if(cur.length<L){
    row.classList.remove("shake");void row.offsetWidth;row.classList.add("shake");
    return toast("Word must be 6 letters.");
  }
  const res=evaluate(cur),g=cur;
  guesses.push(g);results.push(res);cur="";busy=true;
  const C={g:"var(--g)",y:"var(--y)",x:"var(--x)"};
  res.forEach((r,i)=>{
    const t=row.children[i];t.classList.remove("pop");
    t.style.setProperty("--c",C[r]);t.style.animationDelay=(i*FLIP)+"ms";t.classList.add("rev");
  });
  setTimeout(()=>{
    const rank={x:1,y:2,g:3};
    for(let i=0;i<L;i++){const r=res[i],c=g[i];if(!keys[c]||rank[r]>rank[keys[c]])keys[c]=r}
    drawKeys();busy=false;
    if(g===ANSWER){won=true;return win(row)}
    const before=board.children.length;
    ensureRows(Math.max(START,guesses.length+1)); // add a fresh empty row when the rows run out
    const nr=board.children[guesses.length];if(nr)nr.scrollIntoView({block:"nearest"});
    if(board.children.length>before)toast("An additional row has been added. You can do this.");
  },(L-1)*FLIP+500+30);
}
function win(row){
  [...row.children].forEach((t,i)=>{t.classList.remove("rev");t.style.animationDelay=(i*100)+"ms";t.classList.add("win")});
  setTimeout(finish,2000);
}
function shareText(){
  const emo={g:"🟩",y:"🟨",x:"⬛"};
  return "رای اسسی من شایان صالحه\nSSC Wordle — "+guesses.length+(guesses.length===1?" attempt":" attempts")+"\n\n"+results.map(r=>r.map(c=>emo[c]).join("")).join("\n");
}
function finish(){
  $("toasts").innerHTML="";
  $("tries").textContent="Solved in "+guesses.length+(guesses.length===1?" attempt.":" attempts.");
  $("share").textContent=shareText();
  $("modal").classList.remove("hide");
}
function flashBtn(t){const btn=$("sh");btn.textContent=t;setTimeout(()=>btn.textContent="Share",2000)}
async function copyText(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){}
  try{ // older browsers / in-app browsers
    const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;opacity:0";
    document.body.appendChild(ta);ta.select();const ok=document.execCommand("copy");ta.remove();return ok;
  }catch(e){return false}
}
$("sh").onclick=()=>{
  // called straight from the tap, so the phone's native share sheet is allowed to open
  const link=/^https?:/.test(location.protocol)?"\n"+location.href:"";
  const text=shareText()+link;
  const fallback=async()=>{
    if(await copyText(text))flashBtn("Copied ✅");
    else{
      const r=document.createRange();r.selectNodeContents($("share"));
      const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
      $("tries").textContent="Text selected. Please copy and send it.";
    }
  };
  if(navigator.share){
    navigator.share({title:"SSC Wordle",text}).catch(e=>{if(!e||e.name!=="AbortError")fallback()});
  }else fallback();
};
$("again").onclick=reset;

const LAYOUT=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
function buildKb(){
  const kb=$("kb");kb.innerHTML="";
  LAYOUT.forEach((row,ri)=>{
    const d=document.createElement("div");d.className="kr";
    if(ri===1){const s=document.createElement("div");s.style.flex=".5";d.appendChild(s)}
    if(ri===2){const e=document.createElement("button");e.className="k w";e.textContent="enter";e.onclick=()=>press("ENTER");d.appendChild(e)}
    for(const ch of row){const b=document.createElement("button");b.className="k";b.id="k"+ch;b.textContent=ch;b.onclick=()=>press(ch);d.appendChild(b)}
    if(ri===2){const e=document.createElement("button");e.className="k w";e.textContent="⌫";e.onclick=()=>press("DEL");d.appendChild(e)}
    if(ri===1){const s=document.createElement("div");s.style.flex=".5";d.appendChild(s)}
    kb.appendChild(d);
  });
}
function drawKeys(){for(const c in keys){const b=$("k"+c);if(b)b.className="k "+keys[c]}}
// uses key position, so it also works while a Persian layout is active
addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==="Enter"){e.preventDefault();return press("ENTER")}
  if(e.key==="Backspace")return press("DEL");
  const m=/^Key([A-Z])$/.exec(e.code);
  if(m)press(m[1]);
});
function reset(){
  guesses=[];results=[];cur="";busy=false;won=false;keys={};
  board.innerHTML="";ensureRows(START);buildKb();
  $("modal").classList.add("hide");$("toasts").innerHTML="";
}
reset();
</script>
</body>
</html>
